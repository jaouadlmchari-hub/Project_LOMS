name: LOMS CI/CD Ultra-Optimized

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. JOB DÉDIÉ UNIQUEMENT AUX SERVICES BACKEND .NET
  build-and-test-backend:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "JJ.1213famass"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'JJ.1213famass' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: false
      matrix:
        service:
          [LOMS_Employee, LOMS_Auth, LOMS_Applications, LOMS_Leave, LOMS_Salary]

    steps:
      - uses: actions/checkout@v4

      - name: Restore, Build & Test (.NET)
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Database=LOMS_EmployeeDB;User Id=sa;Password=JJ.1213famass;TrustServerCertificate=True"
        run: |
          PROJ_FILE=$(find ./${{ matrix.service }} -name "*_API.csproj" | head -n 1)
          echo "Building: $PROJ_FILE"
          dotnet restore "$PROJ_FILE"
          dotnet build "$PROJ_FILE" -c Release --no-restore

          TEST_PROJECT=$(find . -name "${{ matrix.service }}*Tests.csproj" | head -n 1)
          if [ -n "$TEST_PROJECT" ]; then
            echo "Testing: $TEST_PROJECT"
            dotnet test "$TEST_PROJECT" -c Release --filter "FullyQualifiedName!~Integration"
          fi

  # 2. JOB DÉDIÉ UNIQUEMENT AU FRONTEND REACT (LOMS_Web)
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Build Frontend
        run: |
          cd LOMS_Web
          npm json || npm install
          npm run build

  # 3. JOB DE DÉPLOIEMENT GLOBAL (DOCKER HUB)
  deploy:
    needs: [build-and-test-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            LOMS_Employee,
            LOMS_Auth,
            LOMS_Applications,
            LOMS_Leave,
            LOMS_Salary,
            LOMS_Web,
          ]
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Lowercase Service Name
        id: service_name
        run: echo "lower=$(echo ${{ matrix.service }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.service_name.outputs.lower }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
